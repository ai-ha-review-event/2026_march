// 3. URL의 유형에 맞는 설명과 해시태그를 결합해 복사
async function copyText() {
  const params = new URLSearchParams(window.location.search);
  const type = params.get("type") || "";

  const cafe = type.charAt(0);
  const service = type.slice(1);

  const serviceText = serviceTexts[service];
  const hashtagText = hashtags[cafe];
  const msg = document.getElementById("msg");
  const button = document.getElementById("copyButton");

  if (!serviceText || !hashtagText) {
    msg.innerText = "링크 설정을 확인해 주세요.";
    return;
  }

  // 서비스 설명과 해시태그 사이에 빈 줄 추가
  const fullText = serviceText + "\n\n" + hashtagText;

  try {
    await navigator.clipboard.writeText(fullText);
    msg.innerText = "서비스 설명과 해시태그가 복사되었습니다!";
    button.innerText = "✅ 복사 완료!";
  } catch (error) {
    msg.innerText = "복사에 실패했어요. HTTPS 주소로 접속한 뒤 다시 눌러주세요.";
  }
}
